name: Bug regression
description: A bug fix that must include a failing regression test first
title: "fix: "
labels: ["type:bug", "type:regression"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include logs, status, screenshots, or reproduction notes when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Give deterministic local steps where possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression test plan
      description: Name the small regression test and the larger behavior/integration proof it should feed.
      placeholder: |
        - Smallest regression test:
          - Test file:
          - Expected red command:
          - Expected red reason:
        - Behavior/integration proof:
          - Test file or smoke:
          - Expected red command:
          - Expected red reason:
    validations:
      required: true
  - type: textarea
    id: blast_radius
    attributes:
      label: Blast radius
      description: What user, operator, deployment, or data path could this affect?
    validations:
      required: true
  - type: textarea
    id: agent_todos
    attributes:
      label: Agent todo checklist
      value: |
        - [ ] Reproduce or explain why the bug cannot be reproduced locally.
        - [ ] Add the failing regression test.
        - [ ] Confirm the expected red state before implementation.
        - [ ] Commit the failing test-only change on the work branch.
        - [ ] Implement the smallest fix that turns the regression test green.
        - [ ] Commit the green fix separately from the red test commit.
        - [ ] Run the targeted regression test and adjacent suite.
        - [ ] Update known-issues if applicable.
    validations:
      required: true
  - type: textarea
    id: tdd_audit
    attributes:
      label: TDD audit trail
      value: |
        - [ ] Red regression commit planned:
          - Commit:
          - Failing command/output:
        - [ ] Green fix commit planned:
          - Commit:
          - Passing command/output:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] Regression test observed red first
        - [ ] Red test commit exists on the work branch
        - [ ] Green fix commit exists after the red test commit
        - [ ] Targeted tests pass
        - [ ] Adjacent suite passes
        - [ ] Known issues updated if applicable
    validations:
      required: true
